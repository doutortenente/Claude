# Template versionado de ~/.codex/config.toml
# Secrets são carregados do ambiente ou de ~/projetos/.env
# Sincronizar via: python3 ~/projetos/claude/scripts/sync-claude-config.py --apply

notify = [
    "/usr/bin/env",
    "node",
    "/home/dr/.tokentracker/bin/notify.cjs",
]
approvals_reviewer = "user"
sandbox_mode = "danger-full-access"
model = "gpt-5.6-sol"
model_reasoning_effort = "ultra"

[mcp_servers.webstorm]
url = "http://127.0.0.1:64542/stream"
enabled = false

[mcp_servers.jetbrains-index]
url = "http://127.0.0.1:29172/index-mcp/streamable-http"
enabled = false

[mcp_servers.jetbrains-steroid]
url = "http://127.0.0.1:6315/mcp"
enabled = false

[mcp_servers.playwright]
command = "npx"
args = ["@playwright/mcp@latest"]
enabled = false

[mcp_servers.webstorm-index]
url = "http://127.0.0.1:29172/index-mcp/streamable-http"
enabled = false

[mcp_servers.node_repl]
args = []
command = "/usr/lib/chatgpt/resources/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "/usr/lib/chatgpt/resources/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "/home/dr/.codex:/usr/lib/chatgpt/resources/cua_node/lib/node_modules"
CODEX_HOME = "/home/dr/.codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "0"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = "Control the in-app browser in conjunction with the Browser Plugin."
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = "Control the Chrome browser in conjunction with the Chrome Plugin. Prefer this method of controlling Chrome over alternatives (such as Computer Use) unless the user explicitly mentions an alternative."
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.818.41705"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"/home/dr/.codex/plugins/cache/openai-bundled/browser/26.818.41705/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "/usr/lib/chatgpt/resources/codex"

[mcp_servers.agentbridge]
url = "http://127.0.0.1:8642/mcp"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[tui.model_availability_nux]
"gpt-5.6-sol" = 1

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
ULTRACOST_GATE = "off"
CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1"
ANTHROPIC_BASE_URL = "http://127.0.0.1:20128/v1"
ANTHROPIC_AUTH_TOKEN = "${ANTHROPIC_AUTH_TOKEN}"
ANTHROPIC_DEFAULT_FABLE_MODEL = "cc/claude-fable-5"
ANTHROPIC_DEFAULT_OPUS_MODEL = "ag/claude-opus-4-6-thinking"
ANTHROPIC_DEFAULT_SONNET_MODEL = "cx/gpt-5.6-sol"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "groq/openai/gpt-oss-120b"

[projects."/home/dr/projetos"]
